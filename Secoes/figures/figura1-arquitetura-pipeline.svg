<svg viewBox="0 0 780 860" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, sans-serif" font-size="13">
  <title>Pipeline de Agentes</title>
  <desc>Diagrama do pipeline com Agentes 1a, 1b, 2 e 3 mostrando fluxo de detecção, verificação de resolubilidade e estruturação de requisitos.</desc>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#6b7280"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#ef4444"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#16a34a"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="780" height="860" fill="#ffffff" rx="12"/>

  <text x="390" y="32" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">Pipeline de Processamento de Requisitos</text>

  <!-- INPUT -->
  <rect x="270" y="52" width="240" height="44" rx="8" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="390" y="69" text-anchor="middle" font-size="12" font-weight="600" fill="#0369a1">INPUT</text>
  <text x="390" y="86" text-anchor="middle" font-size="11" fill="#0369a1">base_requirement_text</text>

  <line x1="390" y1="96" x2="390" y2="116" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ETAPA 1 container -->
  <rect x="60" y="118" width="660" height="200" rx="10" fill="#fafafa" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="84" y="138" font-size="11" font-weight="700" fill="#6b7280">ETAPA 1 — Detecção  (executada 1× por requisito; reutilizada em C0, C1, C2)</text>

  <!-- Agent 1a -->
  <rect x="90" y="150" width="270" height="148" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="225" y="170" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">Agente 1a</text>
  <text x="225" y="185" text-anchor="middle" font-size="11" fill="#1d4ed8">Detector de Ambiguidades</text>
  <line x1="105" y1="193" x2="345" y2="193" stroke="#bfdbfe" stroke-width="1"/>
  <text x="225" y="209" text-anchor="middle" font-size="10.5" fill="#374151">Identifica e classifica fragmentos</text>
  <text x="225" y="223" text-anchor="middle" font-size="10.5" fill="#374151">ambíguos (taxonomia de Pohl, 2025):</text>
  <text x="225" y="237" text-anchor="middle" font-size="10" fill="#6b7280">lexical · sintática · semântica</text>
  <text x="225" y="250" text-anchor="middle" font-size="10" fill="#6b7280">referencial · vaguidade</text>
  <rect x="155" y="260" width="140" height="24" rx="5" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="225" y="276" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1e40af">flag: has_ambiguity</text>

  <!-- Agent 1b -->
  <rect x="420" y="150" width="270" height="148" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="555" y="170" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">Agente 1b</text>
  <text x="555" y="185" text-anchor="middle" font-size="11" fill="#15803d">Detector de Concern Mixing</text>
  <line x1="435" y1="193" x2="675" y2="193" stroke="#bbf7d0" stroke-width="1"/>
  <text x="555" y="209" text-anchor="middle" font-size="10.5" fill="#374151">Avalia se a sentença combina</text>
  <text x="555" y="223" text-anchor="middle" font-size="10.5" fill="#374151">ação funcional + critério de</text>
  <text x="555" y="237" text-anchor="middle" font-size="10.5" fill="#374151">qualidade (Pohl, 2025)</text>
  <text x="555" y="251" text-anchor="middle" font-size="10" fill="#6b7280">Separação evita interferência</text>
  <rect x="475" y="260" width="160" height="24" rx="5" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="555" y="276" text-anchor="middle" font-size="10.5" font-weight="600" fill="#15803d">flag: has_concern_mixing</text>

  <!-- Sequential note between agents -->
  <line x1="360" y1="224" x2="420" y2="224" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <text x="390" y="218" text-anchor="middle" font-size="9" fill="#9ca3af">sequencial</text>
  <text x="390" y="231" text-anchor="middle" font-size="9" fill="#9ca3af">(↔ paralel.)</text>

  <!-- 1a output to Agent 2 -->
  <line x1="225" y1="318" x2="225" y2="356" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <!-- 1b output to Agent 3 -->
  <line x1="555" y1="318" x2="555" y2="710" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arr-green)"/>
  <text x="568" y="530" font-size="9.5" fill="#15803d">1b output</text>
  <text x="568" y="543" font-size="9.5" fill="#15803d">→ Ag. 3</text>

  <!-- AGENT 2 -->
  <text x="236" y="340" font-size="9.5" fill="#1d4ed8">1a output</text>

  <rect x="90" y="358" width="430" height="160" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="305" y="378" text-anchor="middle" font-size="12" font-weight="700" fill="#c2410c">Agente 2 — Verificação de Resolubilidade</text>
  <line x1="105" y1="386" x2="505" y2="386" stroke="#fed7aa" stroke-width="1"/>
  <text x="305" y="401" text-anchor="middle" font-size="10.5" fill="#374151">Recebe: requisito + contexto controlado + output Agente 1a</text>
  <text x="305" y="416" text-anchor="middle" font-size="10.5" fill="#374151">Determina status por ambiguidade: resolvable · unresolved · not_applicable</text>

  <rect x="108" y="426" width="235" height="34" rx="5" fill="#fef3c7" stroke="#fbbf24" stroke-width="1"/>
  <text x="225" y="439" text-anchor="middle" font-size="9.5" fill="#92400e">Se has_ambiguity: false →</text>
  <text x="225" y="452" text-anchor="middle" font-size="9.5" fill="#92400e">bloco sintético do orquestrador</text>

  <rect x="108" y="472" width="118" height="32" rx="5" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="167" y="485" text-anchor="middle" font-size="9.5" font-weight="600" fill="#15803d">fully_resolvable</text>
  <text x="167" y="498" text-anchor="middle" font-size="9" fill="#15803d">→ Ag. 3</text>

  <rect x="236" y="472" width="118" height="32" rx="5" fill="#fef9c3" stroke="#fde047" stroke-width="1"/>
  <text x="295" y="485" text-anchor="middle" font-size="9.5" font-weight="600" fill="#854d0e">no_ambiguity</text>
  <text x="295" y="498" text-anchor="middle" font-size="9" fill="#854d0e">→ Ag. 3</text>

  <rect x="364" y="472" width="118" height="32" rx="5" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
  <text x="423" y="485" text-anchor="middle" font-size="9.5" font-weight="600" fill="#b91c1c">non_resolvable</text>
  <text x="423" y="498" text-anchor="middle" font-size="9" fill="#b91c1c">→ encerrado</text>

  <line x1="423" y1="504" x2="423" y2="554" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <rect x="363" y="556" width="120" height="30" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="423" y="571" text-anchor="middle" font-size="10.5" font-weight="600" fill="#b91c1c">ENCERRADO</text>
  <text x="423" y="583" text-anchor="middle" font-size="9" fill="#b91c1c">não chega ao Ag. 3</text>

  <!-- Route to Agent 3 -->
  <line x1="167" y1="504" x2="167" y2="562" stroke="#16a34a" stroke-width="1.5"/>
  <line x1="295" y1="504" x2="295" y2="562" stroke="#16a34a" stroke-width="1.5"/>
  <line x1="167" y1="562" x2="295" y2="562" stroke="#16a34a" stroke-width="1.5"/>
  <line x1="231" y1="562" x2="231" y2="710" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="150" y="600" font-size="9.5" fill="#16a34a">2 output</text>

  <!-- AGENT 3 -->
  <rect x="90" y="712" width="440" height="118" rx="8" fill="#fdf4ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="310" y="732" text-anchor="middle" font-size="12" font-weight="700" fill="#7e22ce">Agente 3 — Estruturador</text>
  <line x1="105" y1="740" x2="515" y2="740" stroke="#e9d5ff" stroke-width="1"/>
  <text x="310" y="755" text-anchor="middle" font-size="10.5" fill="#374151">Recebe: requisito + contexto + output Ag. 1b + output Ag. 2</text>
  <text x="310" y="769" text-anchor="middle" font-size="10.5" fill="#374151">Invocado se status global: fully_resolvable ou no_ambiguity</text>
  <text x="310" y="783" text-anchor="middle" font-size="10" fill="#6b7280">Se has_concern_mixing: true → decompõe em 2 artefatos distintos</text>

  <rect x="100" y="796" width="130" height="24" rx="5" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1"/>
  <text x="165" y="812" text-anchor="middle" font-size="9.5" font-weight="600" fill="#6d28d9">functional_requirement</text>

  <rect x="240" y="796" width="130" height="24" rx="5" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1"/>
  <text x="305" y="812" text-anchor="middle" font-size="9.5" font-weight="600" fill="#6d28d9">quality_requirement</text>

  <rect x="380" y="796" width="130" height="24" rx="5" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1"/>
  <text x="445" y="812" text-anchor="middle" font-size="9.5" font-weight="600" fill="#6d28d9">constraint</text>

  <line x1="310" y1="830" x2="310" y2="850" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="310" y="858" text-anchor="middle" font-size="11" font-weight="600" fill="#6b7280">requisito estruturado (output)</text>

  <!-- Context arrows (left side) -->
  <line x1="22" y1="438" x2="88" y2="438" stroke="#f97316" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="11" y="435" text-anchor="middle" font-size="9" fill="#c2410c" writing-mode="tb">contexto</text>
  <line x1="22" y1="770" x2="88" y2="770" stroke="#a855f7" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="11" y="767" text-anchor="middle" font-size="9" fill="#7e22ce" writing-mode="tb">contexto</text>

  <!-- Requirement arrows (right side) -->
  <line x1="735" y1="438" x2="522" y2="438" stroke="#f97316" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="745" y="441" font-size="9" fill="#c2410c" text-anchor="start">req.</text>
  <line x1="735" y1="770" x2="532" y2="770" stroke="#a855f7" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="745" y="773" font-size="9" fill="#7e22ce" text-anchor="start">req.</text>

  <!-- Legend -->
  <rect x="590" y="358" width="158" height="130" rx="6" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
  <text x="669" y="374" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6b7280">Legenda</text>
  <rect x="602" y="382" width="12" height="10" rx="2" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="620" y="391" font-size="9.5" fill="#374151">Agente 1a</text>
  <rect x="602" y="399" width="12" height="10" rx="2" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="620" y="408" font-size="9.5" fill="#374151">Agente 1b</text>
  <rect x="602" y="416" width="12" height="10" rx="2" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="620" y="425" font-size="9.5" fill="#374151">Agente 2</text>
  <rect x="602" y="433" width="12" height="10" rx="2" fill="#fdf4ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="620" y="442" font-size="9.5" fill="#374151">Agente 3</text>
  <line x1="602" y1="455" x2="614" y2="455" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="620" y="459" font-size="9.5" fill="#374151">non_resolvable</text>
  <line x1="602" y1="471" x2="614" y2="471" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="620" y="475" font-size="9.5" fill="#374151">rota ativa</text>
</svg>
