<svg viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui,-apple-system,sans-serif">
  <title>Arquitetura do pipeline</title>
  <desc>Fluxo do pipeline com Agent 1, Agent 2, Agent 3 e consolidador.</desc>

  <rect width="800" height="480" rx="14" fill="#111113"/>

  <defs>
    <marker id="a0" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#52525b"/>
    </marker>
    <marker id="ag" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#34d399"/>
    </marker>
    <marker id="ar" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#f87171"/>
    </marker>
  </defs>

  <!-- ─── CORPUS ─── -->
  <rect x="18" y="216" width="88" height="48" rx="7"
        fill="#1c1c1f" stroke="#3a3a3d" stroke-width="1.4" stroke-dasharray="5,3"/>
  <text x="62" y="235" text-anchor="middle" fill="#71717a" font-size="10" font-weight="700" letter-spacing=".6">CORPUS</text>
  <text x="62" y="251" text-anchor="middle" fill="#52525b" font-size="10">manifest.yaml</text>

  <line x1="106" y1="240" x2="136" y2="240" stroke="#52525b" stroke-width="1.4" marker-end="url(#a0)"/>

  <!-- ─── AGENT 1 ─── -->
  <rect x="138" y="212" width="112" height="56" rx="8"
        fill="#1e1e22" stroke="#3f3f46" stroke-width="1.4"/>
  <text x="194" y="232" text-anchor="middle" fill="#71717a" font-size="10" font-weight="700" letter-spacing=".6">AGENT 1</text>
  <text x="194" y="248" text-anchor="middle" fill="#e4e4e7" font-size="12" font-weight="600">Ambiguity</text>
  <text x="194" y="262" text-anchor="middle" fill="#e4e4e7" font-size="12" font-weight="600">Detector</text>

  <line x1="250" y1="240" x2="280" y2="240" stroke="#52525b" stroke-width="1.4" marker-end="url(#a0)"/>

  <!-- ─── DIAMOND 1 ─── center (318,240) hw=50 hh=32 -->
  <polygon points="268,240 318,208 368,240 318,272"
           fill="#1e1e22" stroke="#3f3f46" stroke-width="1.4"/>
  <text x="318" y="235" text-anchor="middle" fill="#a1a1aa" font-size="10" font-weight="600">has_</text>
  <text x="318" y="248" text-anchor="middle" fill="#a1a1aa" font-size="10" font-weight="600">ambiguity?</text>

  <!-- NÃO: topo do diamond → sobe → direita → desce até Agent 3 -->
  <line x1="318" y1="208" x2="318" y2="96"  stroke="#34d399" stroke-width="1.5"/>
  <line x1="318" y1="96"  x2="719" y2="96"  stroke="#34d399" stroke-width="1.5"/>
  <line x1="719" y1="96"  x2="719" y2="212" stroke="#34d399" stroke-width="1.5" marker-end="url(#ag)"/>
  <text x="308" y="155" fill="#34d399" font-size="10" font-weight="600" text-anchor="middle">não</text>

  <!-- bloco sintético label -->
  <rect x="376" y="78" width="156" height="34" rx="6"
        fill="#0d2a1e" stroke="#34d399" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="454" y="92" text-anchor="middle" fill="#34d399" font-size="10" font-weight="600">bloco sintético</text>
  <text x="454" y="105" text-anchor="middle" fill="#34d399" font-size="10">status: no_ambiguity</text>

  <!-- SIM: diamond1 → agent2 -->
  <line x1="368" y1="240" x2="400" y2="240" stroke="#52525b" stroke-width="1.4" marker-end="url(#a0)"/>
  <text x="384" y="232" text-anchor="middle" fill="#71717a" font-size="10" font-weight="600">sim</text>

  <!-- ─── CONTEXT badge ─── -->
  <rect x="406" y="148" width="106" height="38" rx="6"
        fill="#1c1c1f" stroke="#3a3a3d" stroke-width="1.2" stroke-dasharray="3,2"/>
  <text x="459" y="162" text-anchor="middle" fill="#52525b" font-size="9.5" font-weight="700" letter-spacing=".5">CONTEXTO</text>
  <text x="459" y="176" text-anchor="middle" fill="#52525b" font-size="10">C0 · C1 · C2 · C3</text>
  <line x1="459" y1="186" x2="459" y2="210" stroke="#3a3a3d" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#a0)"/>

  <!-- ─── AGENT 2 ─── -->
  <rect x="402" y="212" width="114" height="56" rx="8"
        fill="#1e1e22" stroke="#3f3f46" stroke-width="1.4"/>
  <text x="459" y="232" text-anchor="middle" fill="#71717a" font-size="10" font-weight="700" letter-spacing=".6">AGENT 2</text>
  <text x="459" y="248" text-anchor="middle" fill="#e4e4e7" font-size="12" font-weight="600">Resolubility</text>
  <text x="459" y="262" text-anchor="middle" fill="#e4e4e7" font-size="12" font-weight="600">Validator</text>

  <line x1="516" y1="240" x2="546" y2="240" stroke="#52525b" stroke-width="1.4" marker-end="url(#a0)"/>

  <!-- ─── DIAMOND 2 ─── center (596,240) hw=50 hh=32 -->
  <polygon points="546,240 596,208 646,240 596,272"
           fill="#1e1e22" stroke="#3f3f46" stroke-width="1.4"/>
  <text x="596" y="234" text-anchor="middle" fill="#a1a1aa" font-size="9.5" font-weight="600">fully_</text>
  <text x="596" y="248" text-anchor="middle" fill="#a1a1aa" font-size="9.5" font-weight="600">resolvable?</text>

  <!-- SIM: diamond2 → agent3 -->
  <line x1="646" y1="240" x2="662" y2="240" stroke="#34d399" stroke-width="1.5" marker-end="url(#ag)"/>
  <text x="654" y="232" text-anchor="middle" fill="#34d399" font-size="10" font-weight="600">sim</text>

  <!-- ─── AGENT 3 ─── -->
  <rect x="664" y="212" width="114" height="56" rx="8"
        fill="#1e1e22" stroke="#3f3f46" stroke-width="1.4"/>
  <text x="721" y="232" text-anchor="middle" fill="#71717a" font-size="10" font-weight="700" letter-spacing=".6">AGENT 3</text>
  <text x="721" y="248" text-anchor="middle" fill="#e4e4e7" font-size="12" font-weight="600">Requirement</text>
  <text x="721" y="262" text-anchor="middle" fill="#e4e4e7" font-size="12" font-weight="600">Structurer</text>

  <!-- Agent 3 → consolidador (reto pra baixo) -->
  <line x1="721" y1="268" x2="721" y2="395" stroke="#52525b" stroke-width="1.4" marker-end="url(#a0)"/>

  <!-- NÃO: diamond2 → signaling box -->
  <line x1="596" y1="272" x2="596" y2="345" stroke="#f87171" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="606" y="314" fill="#f87171" font-size="10" font-weight="600">não</text>

  <rect x="536" y="347" width="120" height="42" rx="7"
        fill="#2a1010" stroke="#f87171" stroke-width="1.4"/>
  <text x="596" y="365" text-anchor="middle" fill="#f87171" font-size="10" font-weight="700">rota signaling</text>
  <text x="596" y="379" text-anchor="middle" fill="#f87171" font-size="10">clarificação humana</text>

  <!-- signaling → consolidador (entra pela esquerda) -->
  <line x1="596" y1="389" x2="596" y2="418" stroke="#f87171" stroke-width="1.4"/>
  <line x1="596" y1="418" x2="648" y2="418" stroke="#f87171" stroke-width="1.4" marker-end="url(#ar)"/>

  <!-- ─── CONSOLIDADOR ─── -->
  <rect x="650" y="397" width="128" height="48" rx="8"
        fill="#1e1e22" stroke="#3f3f46" stroke-width="1.4"/>
  <text x="714" y="417" text-anchor="middle" fill="#71717a" font-size="10" font-weight="700" letter-spacing=".6">CONSOLIDADOR</text>
  <text x="714" y="434" text-anchor="middle" fill="#e4e4e7" font-size="11">final_output.json</text>

  <!-- ─── LEGEND ─── -->
  <line x1="22" y1="458" x2="46" y2="458" stroke="#34d399" stroke-width="1.5"/>
  <text x="52" y="462" fill="#71717a" font-size="10">rota structured</text>
  <line x1="152" y1="458" x2="176" y2="458" stroke="#f87171" stroke-width="1.5"/>
  <text x="182" y="462" fill="#71717a" font-size="10">rota signaling</text>
  <line x1="272" y1="458" x2="296" y2="458" stroke="#52525b" stroke-width="1.4"/>
  <text x="302" y="462" fill="#71717a" font-size="10">fluxo principal</text>
  <line x1="392" y1="458" x2="416" y2="458" stroke="#3a3a3d" stroke-width="1.4" stroke-dasharray="4,3"/>
  <text x="422" y="462" fill="#71717a" font-size="10">sem LLM</text>
</svg>
