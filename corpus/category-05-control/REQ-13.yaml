    inject_context: false
  C1:
    inject_context: true
    controlled_context:
      domain: Financial post-trade settlement workflow.
      glossary:
        - term: settlement request
          definition: Message requesting settlement of a financial instrument.
        - term: acknowledge message
          definition: Confirmation message indicating successful processing of a settlement request.
      business_rules: []
      constraints: []
  C2:
    inject_context: true
    controlled_context:
      domain: Financial post-trade settlement workflow.
      glossary:
        - term: System-B
          definition: Downstream system that receives settlement acknowledgements.
      business_rules:
        - id: BR-01
          rule: An acknowledge message is sent to System-B only after the settlement request has passed validation.
      constraints: []
