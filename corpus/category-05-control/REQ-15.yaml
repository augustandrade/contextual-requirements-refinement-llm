id: REQ-15
category_id: category-05-control
category_name: Control group
title: Self-contained quality requirement
source:
  citation: Pohl (2025), Chapter 1, Section 1.5
base_requirement_text: The system shall process 95 percent of all queries within 1.5
  seconds and must not take longer than 4 seconds to process queries at any given
  time.
expected_problem: No ambiguity or structural defect expected. Quantified, objective,
  and verifiable quality requirement, requiring no external cross-reference to be
  understood.
contexts:
  C0:
    inject_context: false
  C1:
    inject_context: true
    controlled_context:
      domain: Query-processing system with a performance SLA.
      glossary:
      - &id001
        term: query
        definition: A single request submitted to the system for processing.
      business_rules: []
      constraints: []
  C2:
    inject_context: true
    controlled_context:
      domain: Query-processing system with a performance SLA.
      glossary:
      - *id001
      business_rules: []
      constraints:
      - id: QLT-01
        text: Latency is measured from the instant the system receives the complete
          request payload to the instant the last byte of the response is transmitted,
          under a sustained load of up to 500 concurrent queries.
  C3:
    inject_context: true
    controlled_context:
      domain: Query-processing system with a performance SLA.
      glossary:
      - *id001
      - term: API client token
        definition: Authentication credential issued per registered caller, used to
          identify the source of each query and enforce per-client rate limits.
      business_rules:
      - id: BR-01
        rule: Each registered API client is subject to a rate limit of 100 queries
          per second; requests exceeding this limit must receive an HTTP 429 response
          and must not be queued for processing.
      constraints: []
notes: Pohl (§1.5) presents this as a well-formed quality requirement without flagging
  a defect. The sentence combines two distinct quality criteria (95th-percentile latency
  and absolute maximum latency) in one statement but the source does not identify
  this as a defect, so the ground truth is no-defect.
