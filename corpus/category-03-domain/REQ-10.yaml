id: REQ-11
category_id: category-03-domain
category_name: Domain or context-specific ambiguities
title: Pragmatic ambiguity in dial tone generation
source:
  citation: Kamsties (2001)
base_requirement_text: "Generate a dial tone."
expected_problem: Dial tone parameters depend on the telecommunications standard and region.
expected_behavior: Mark missing operational standard unless context specifies the applicable telephony profile.
contexts:
  C0:
    intent: no_context
    inject_context: false
  C1:
    intent: general_context
    inject_context: true
    controlled_context:
      domain: Digital telephony exchange system.
      glossary:
        - term: dial tone
          definition: Tone signaling line readiness for dialing.
      business_rules: []
      constraints: []
  C2:
    intent: resolutive_context
    inject_context: true
    controlled_context:
      domain: Digital telephony exchange system.
      glossary: []
      business_rules: []
      constraints:
        - id: CST-01
          text: System follows North American telephony standard using simultaneous 350 Hz and 440 Hz dial tone.
tags: [domain, pragmatic-ambiguity, standards]
status: ready
manual_reference:
  C0:
    expected_resolubility: "unresolved"
    expected_actions:
      - identify_ambiguity
      - classify_ambiguity
      - signal_unresolved_ambiguity
      - avoid_unsupported_inference
    expected_findings:
      - missing operational standard
      - domain-dependent ambiguity
    should_not_do:
      - infer telephony parameters without evidence
      - invent a region-specific profile
    applicable_criteria:
      - ambiguity
      - contextual_resolubility
      - semantic_explicitation
      - clarity

  C1:
    expected_resolubility: "unresolved"
    expected_actions:
      - identify_ambiguity
      - classify_ambiguity
      - signal_unresolved_ambiguity
      - avoid_unsupported_inference
    expected_findings:
      - missing operational standard
      - domain-dependent ambiguity
    should_not_do:
      - infer telephony parameters without evidence
      - invent a region-specific profile
    applicable_criteria:
      - ambiguity
      - contextual_resolubility
      - semantic_explicitation
      - clarity

  C2:
    expected_resolubility: "resolvable"
    expected_actions:
      - identify_ambiguity
      - classify_ambiguity
      - refine_text
      - preserve_requirement
    expected_findings:
      - missing operational standard
      - domain-dependent ambiguity
    should_not_do:
      - infer a telephony profile beyond the provided standard
      - ignore the explicit frequency values
    applicable_criteria:
      - ambiguity
      - contextual_resolubility
      - semantic_explicitation
      - clarity
