id: REQ-09
category_id: category-03-domain
category_name: Domain or context-specific ambiguities
title: Operational technical gap in traffic filtering statement
source:
  citation: Bashir et al. (2025), ICSME 2025, Listing 1 (R1), Westermo dataset
base_requirement_text: Routing switches ability to filter network traffic between data-plane interfaces and management data traffic.
expected_problem: Incomplete wording and missing technical definitions for filtering behavior and management traffic.
expected_behavior: Identify operational gaps and require technical definitions before precise restructuring.
contexts:
  C0:
    inject_context: false
  C1:
    inject_context: true
    controlled_context:
      domain: Industrial railway communication network using routing switches.
      glossary:
        - term: management data traffic
          definition: Administrative traffic used for device monitoring and control.
      business_rules: []
      constraints: []
  C2:
    inject_context: true
    controlled_context:
      domain: Industrial railway communication network using routing switches.
      glossary:
        - term: management data traffic
          definition: SNMP traffic restricted to UDP port 161.
        - term: filter network traffic
          definition: Inspect and drop packets based on protocol and destination port.
        - term: data-plane interfaces
          definition: The 4 Ethernet ports (eth0-eth3) carrying passenger network data traffic, distinct from the dedicated management port.
      business_rules: []
      constraints: []
notes: "Technical gap here is a data-scope deficiency, not concern mixing — do not classify as concern_mixing (Pohl §25.2: concern mixing = functional action + quality criterion in the same sentence; this is an operational definition gap)."
manual_reference:
  C0:
    expected_resolubility: unresolved
    expected_has_concern_mixing: false

  C1:
    expected_resolubility: unresolved
    expected_has_concern_mixing: false

  C2:
    expected_resolubility: resolvable
