id: REQ-09
category_id: category-03-domain
category_name: Domain or context-specific ambiguities
title: Operational technical gap in traffic filtering statement
source:
  citation: Bashir et al. (2025), ICSME 2025, Listing 1 (R1), Westermo dataset
base_requirement_text: Routing switches ability to filter network traffic between
  data-plane interfaces and management data traffic.
expected_problem: Key technical terms ('filter network traffic', 'data-plane interfaces',
  'management data traffic') lack operational definitions, making the filtering behaviour
  unimplementable. Per Bashir et al. (2025), this characterises an operational definition
  gap in industrial requirements.
taxonomy_accepted_types:
- lexical
contexts:
  C0:
    inject_context: false
  C1:
    inject_context: true
    controlled_context:
      domain: Industrial railway communication network using routing switches.
      glossary: []
      business_rules: []
      constraints: []
  C2:
    inject_context: true
    controlled_context:
      domain: Industrial railway communication network using routing switches.
      glossary:
      - term: management data traffic
        definition: SNMP traffic restricted to UDP port 161.
      - term: filter network traffic
        definition: Inspect and drop packets based on protocol and destination port.
      - term: data-plane interfaces
        definition: The 4 Ethernet ports (eth0-eth3) carrying passenger network data
          traffic, distinct from the dedicated management port.
      business_rules: []
      constraints: []
  C3:
    inject_context: true
    controlled_context:
      domain: Industrial railway communication network using routing switches.
      glossary:
      - term: traffic log record
        definition: Structured entry written to non-volatile storage for each packet
          evaluated by the switch, containing ingress port, timestamp, and disposition
          (forwarded or dropped).
      business_rules:
      - id: BR-01
        rule: The routing switch must sustain its rated line-rate forwarding throughput
          with filtering active, and must flush completed traffic log records to persistent
          storage within 500 milliseconds of the packet event.
      constraints: []
