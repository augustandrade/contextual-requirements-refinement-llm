id: REQ-08
category_id: category-03-domain
category_name: Domain or context-specific ambiguities
title: Continuous measurement evaluation ambiguity
source:
  citation: Kamsties (2001)
base_requirement_text: "Shut off the pumps if the water level remains above 100 meters for more than 4 seconds."
expected_problem: Missing rule for evaluating continuous measurement within the time window.
expected_behavior: Mark as unresolved ambiguity unless context specifies the evaluation metric.
contexts:
  C0:
    intent: no_context
    inject_context: false
  C1:
    intent: general_context
    inject_context: true
    controlled_context:
      domain: Dam water level control system with automatic pump shutdown.
      glossary:
        - term: water level
          definition: Sensor reading sampled continuously.
      business_rules: []
      constraints: []
  C2:
    intent: resolutive_context
    inject_context: true
    controlled_context:
      domain: Dam water level control system with automatic pump shutdown.
      glossary: []
      business_rules:
        - id: BR-01
          rule: For a 4-second persistence window, the decision metric is the absolute minimum reading in the window.
      constraints: []
tags: [domain, unresolved, measurement-window]
status: ready
manual_reference:
  C0:
    expected_resolubility: "unresolved"
    expected_actions:
      - identify_ambiguity
      - classify_ambiguity
      - signal_unresolved_ambiguity
      - avoid_unsupported_inference
    expected_findings:
      - missing evaluation metric for the time window
      - ambiguous measurement window
    should_not_do:
      - infer a metric for the window without evidence
      - choose a persistence rule arbitrarily
    applicable_criteria:
      - ambiguity
      - contextual_resolubility
      - semantic_explicitation
      - clarity

  C1:
    expected_resolubility: "unresolved"
    expected_actions:
      - identify_ambiguity
      - classify_ambiguity
      - signal_unresolved_ambiguity
      - avoid_unsupported_inference
    expected_findings:
      - missing evaluation metric for the time window
      - ambiguous measurement window
    should_not_do:
      - infer a metric for the window without evidence
      - choose a persistence rule arbitrarily
    applicable_criteria:
      - ambiguity
      - contextual_resolubility
      - semantic_explicitation
      - clarity

  C2:
    expected_resolubility: "resolvable"
    expected_actions:
      - identify_ambiguity
      - classify_ambiguity
      - refine_text
      - preserve_requirement
    expected_findings:
      - missing evaluation metric for the time window
      - ambiguous measurement window
    should_not_do:
      - infer a metric beyond the provided decision rule
      - ignore the persistence-window definition
    applicable_criteria:
      - ambiguity
      - contextual_resolubility
      - semantic_explicitation
      - clarity
