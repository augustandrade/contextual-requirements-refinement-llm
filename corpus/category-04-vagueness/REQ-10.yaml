id: REQ-10
category_id: category-04-vagueness
category_name: Vagueness
title: Vague quantifier in weak word smell
source:
  citation: Unterbusch & Vogelsang (2026), Table 1, ID 255
base_requirement_text: The TCU is connected to the ORC redundantly via CAN and LIN
  to execute automatic emergency calls on certain crash levels.
expected_problem: '''certain'' is a vague quantifier (Pohl 2025, §25.3.5) with no
  measurable boundary — it is unclear which crash levels trigger automatic emergency
  calls. Verbatim example from the source, annotated by the authors as a genuine defect
  (weak word).'
taxonomy_accepted_types:
- vagueness
contexts:
  C0:
    inject_context: false
  C1:
    inject_context: true
    controlled_context:
      domain: Automotive crash-detection and emergency-call system (TCU/ORC).
      glossary:
      - &id001
        term: TCU
        definition: Telematics Control Unit.
      - &id002
        term: ORC
        definition: Occupant Restraint Controller.
      business_rules: []
      constraints: []
  C2:
    inject_context: true
    controlled_context:
      domain: Automotive crash-detection and emergency-call system (TCU/ORC).
      glossary:
      - *id001
      - *id002
      business_rules:
      - id: BR-01
        rule: Automatic emergency calls are triggered for crash severity levels 2
          (moderate) and 3 (severe) on the internal crash severity scale; level 1
          (minor) does not trigger a call.
      constraints: []
  C3:
    inject_context: true
    controlled_context:
      domain: Automotive crash-detection and emergency-call system (TCU/ORC).
      glossary:
      - *id001
      - *id002
      - term: eCall session
        definition: A single end-to-end emergency call attempt initiated by the TCU,
          comprising connection setup, minimum voice duration, and mandatory vehicle
          data transmission to the Public Safety Answering Point (PSAP).
      business_rules:
      - id: BR-01
        rule: An eCall session must maintain an open voice channel for a minimum of
          120 seconds; if the connection is dropped before this threshold, the TCU
          must automatically retry up to three times with a 30-second interval between
          attempts.
      constraints: []
