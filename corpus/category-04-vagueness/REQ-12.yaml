id: REQ-12
category_id: category-04-vagueness
category_name: Vagueness
title: Temporal vagueness in end of day predicate
source:
  citation: Vogelsang et al. (2025), arXiv:2501.04810, Introduction
base_requirement_text: The system shall generate a report at the end of each day.
expected_problem: "'end of each day' is a temporally vague predicate (Pohl 2025, §25.3.5) — it is impossible to determine whether it refers to midnight, end of business hours, or another cutoff."
expected_behavior: "Per Vogelsang et al. (2025), temporally vague predicates should be replaced by precise time specifications with explicit timezone and cutoff definitions."
taxonomy_accepted_types:
  - vagueness
