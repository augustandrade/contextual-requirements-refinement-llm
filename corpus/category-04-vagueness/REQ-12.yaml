id: REQ-12
category_id: category-04-vagueness
category_name: Vagueness
title: Temporal vagueness in end of day predicate
source:
  citation: Vogelsang et al. (2025), arXiv:2501.04810, Introduction
base_requirement_text: The system shall generate a report at the end of each day.
expected_problem: "'end of each day' is a temporally vague predicate (Pohl 2025, §25.3.5) — it is impossible to determine whether it refers to midnight, end of business hours, or another cutoff."
expected_behavior: Flag temporal vagueness and resolve into a precise time specification only when context provides the business rule.
taxonomy_accepted_types:
  - vagueness
contexts:
  C0:
    intent: no_context
    inject_context: false
  C1:
    intent: general_context
    inject_context: true
    controlled_context:
      domain: Enterprise reporting system for financial operations.
      glossary:
        - term: report
          definition: Automated daily summary of processed transactions.
      business_rules: []
      constraints: []
  C2:
    intent: resolutive_context
    inject_context: true
    controlled_context:
      domain: Enterprise reporting system for financial operations.
      glossary: []
      business_rules:
        - id: BR-01
          rule: For reporting purposes, end of day is defined as 23:59:59 UTC on the calendar day.
      constraints: []
tags: [vagueness, temporal-vagueness, weak-predicate]
status: ready
manual_reference:
  C0:
    expected_resolubility: unresolved
    expected_actions:
      - identify_ambiguity
      - classify_ambiguity
      - signal_unresolved_ambiguity
      - avoid_unsupported_inference

  C1:
    expected_resolubility: unresolved
    expected_actions:
      - identify_ambiguity
