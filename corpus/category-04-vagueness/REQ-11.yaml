id: REQ-11
category_id: category-04-vagueness
category_name: Vagueness
title: Boundary vagueness for medium sized vehicles
source:
  citation: Pohl (2025), Chapter 25, §25.3.5, Example 25-9
base_requirement_text: All medium-sized vehicles shall be equipped with a navigation system.
expected_problem: "Per Pohl (2025), Example 25-9, 'medium-sized' is a vague term with no objective boundary — there exist vehicles for which it is impossible to determine whether they belong to this category."
expected_behavior: "Per Pohl (2025), §25.3.5, vague terms should have their extension precisely defined, typically via a glossary entry with measurable boundaries."
