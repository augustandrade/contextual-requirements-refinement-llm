corpus_id: controlled-corpus-v1
title: Controlled corpus for requirement ambiguity analysis
language_policy:
  requirements: en
  contexts: en
  metadata: en
methodology:
  base_requirements: 15
  context_levels: [C0, C1, C2, C3]
  context_level_encoding: key_based
  context_injection_policy:
    C0:
      inject_context: false
      includes_controlled_context: false
      execution: always
      specificity: none
      relevant_to_ambiguity: false
    C1:
      inject_context: true
      includes_controlled_context: true
      execution: when_ambiguity_detected
      specificity: low
      relevant_to_ambiguity: false
    C2:
      inject_context: true
      includes_controlled_context: true
      execution: when_ambiguity_detected
      specificity: high
      relevant_to_ambiguity: true
    C3:
      inject_context: true
      includes_controlled_context: true
      execution: when_ambiguity_detected
      specificity: high
      relevant_to_ambiguity: false
  context_entry_fields:
    C0: [inject_context]
    C1: [inject_context, controlled_context]
    C2: [inject_context, controlled_context]
    C3: [inject_context, controlled_context]
  # C2 vs C3 isolates relevance (specificity held constant)
  # C3 vs C1 isolates specificity (non-relevance held constant)
  # C1 vs C0 measures effect of generic context
  total_executions: 60  # 15 base_requirements × 4 context_levels
  categories:
    - id: category-01-structural
      name: Structural requirement defects
      req_ids: [REQ-01, REQ-02, REQ-03]
    - id: category-02-linguistic
      name: Linguistic ambiguities and formulation defects
      req_ids: [REQ-04, REQ-05, REQ-06]
    - id: category-03-domain
      name: Domain or context-specific ambiguities
      req_ids: [REQ-07, REQ-08, REQ-09]
    - id: category-04-vagueness
      name: Vagueness
      req_ids: [REQ-10, REQ-11, REQ-12]
    - id: category-05-control
      name: Control group
      req_ids: [REQ-13, REQ-14, REQ-15]
items:
  - id: REQ-01
    file: category-01-structural/REQ-01.yaml
  - id: REQ-02
    file: category-01-structural/REQ-02.yaml
  - id: REQ-03
    file: category-01-structural/REQ-03.yaml
  - id: REQ-04
    file: category-02-linguistic/REQ-04.yaml
  - id: REQ-05
    file: category-02-linguistic/REQ-05.yaml
  - id: REQ-06
    file: category-02-linguistic/REQ-06.yaml
  - id: REQ-07
    file: category-03-domain/REQ-07.yaml
  - id: REQ-08
    file: category-03-domain/REQ-08.yaml
  - id: REQ-09
    file: category-03-domain/REQ-09.yaml
  - id: REQ-10
    file: category-04-vagueness/REQ-10.yaml
  - id: REQ-11
    file: category-04-vagueness/REQ-11.yaml
  - id: REQ-12
    file: category-04-vagueness/REQ-12.yaml
  - id: REQ-13
    file: category-05-control/REQ-13.yaml
  - id: REQ-14
    file: category-05-control/REQ-14.yaml
  - id: REQ-15
    file: category-05-control/REQ-15.yaml
status: ready
manual_reference: true
