id: REQ-PILOT-02
category_id: pilot
category_name: Pilot — linguistic (referential ambiguity)
title: Pronoun with two competing antecedents in a healthcare alert context
source:
  citation: Author-constructed
base_requirement_text: The nurse administers the prescribed medication to the patient.
  If she does not respond within 10 minutes, the system shall escalate the alert to
  the duty physician.
expected_problem: The pronoun "she" has two plausible antecedents (nurse, patient).
  Without context, it is impossible to determine which person's non-response triggers
  the escalation.
taxonomy_accepted_types:
- referential
contexts:
  C0:
    inject_context: false
  C1:
    inject_context: true
    controlled_context:
      domain: Hospital patient monitoring system for post-operative care.
      glossary:
      - term: duty physician
        definition: The attending physician responsible for a ward during a given
          shift.
      - term: alert escalation
        definition: The process of notifying a higher-priority care provider when
          a lower-priority care action does not achieve the expected outcome.
      business_rules: []
      constraints: []
  C2:
    inject_context: true
    controlled_context:
      domain: Hospital patient monitoring system for post-operative care.
      glossary:
      - term: duty physician
        definition: The attending physician responsible for a ward during a given
          shift.
      - term: alert escalation
        definition: The process of notifying a higher-priority care provider when
          a lower-priority care action does not achieve the expected outcome.
      business_rules:
      - id: BR-01
        rule: Medication response monitoring applies to the patient, not the care
          provider. If the patient does not show a recorded response event within
          the specified observation window after medication administration, the system
          escalates the alert to the duty physician.
      constraints:
      - id: OBS-01
        text: The observation window for response detection is 10 minutes from the
          administration timestamp recorded by the system.
  C3:
    inject_context: true
    controlled_context:
      domain: Hospital patient monitoring system for post-operative care.
      glossary:
      - term: duty physician
        definition: The attending physician responsible for a ward during a given
          shift.
      - term: alert escalation
        definition: The process of notifying a higher-priority care provider when
          a lower-priority care action does not achieve the expected outcome.
      - term: physician acknowledgment
        definition: Explicit confirmation recorded in the system when the duty physician
          receives and accepts an escalated alert.
      business_rules:
      - id: BR-01
        rule: An escalated alert must be acknowledged by the duty physician within
          5 minutes; if no acknowledgment is recorded, the system must re-escalate
          to the on-call senior physician and log the missed acknowledgment with a
          timestamp.
      constraints: []
