id: REQ-PILOT-03
category_id: pilot
category_name: Pilot — domain (vagueness)
title: Eligibility criterion without measurable definition in an HR leave system
source:
  citation: Author-constructed
base_requirement_text: The system shall automatically approve the leave request if
  the employee is eligible.
expected_problem: The term "eligible" is vague — its extension is indeterminate without
  a formal eligibility definition, making automatic approval criteria impossible to
  implement.
taxonomy_accepted_types:
- vagueness
contexts:
  C0:
    inject_context: false
  C1:
    inject_context: true
    controlled_context:
      domain: Human resources management system for a mid-sized enterprise.
      glossary:
      - term: leave request
        definition: A formal employee request for planned absence from work, submitted
          through the HR system.
      - term: automatic approval
        definition: Approval granted by the system without requiring manual review
          by a manager.
      business_rules: []
      constraints: []
  C2:
    inject_context: true
    controlled_context:
      domain: Human resources management system for a mid-sized enterprise.
      glossary:
      - term: leave request
        definition: A formal employee request for planned absence from work, submitted
          through the HR system.
      - term: automatic approval
        definition: Approval granted by the system without requiring manual review
          by a manager.
      - term: eligible
        definition: 'An employee is eligible for automatic leave approval when ALL
          of the following conditions are simultaneously met: (a) accrued leave balance
          is at least equal to the number of days requested; (b) no active disciplinary
          action on record; (c) the requested dates do not overlap a mandatory attendance
          window; and (d) the direct manager has not placed a temporary approval hold
          on the employee''s account.'
      business_rules:
      - id: BR-01
        rule: Automatic approval is granted when all four eligibility conditions defined
          in the glossary entry for 'eligible' are satisfied. Any single condition
          failing causes the system to route the request to manual review instead.
      constraints:
      - id: HR-01
        text: The system must log the specific eligibility condition that caused automatic
          approval or the specific condition that triggered manual review routing.
  C3:
    inject_context: true
    controlled_context:
      domain: Human resources management system for a mid-sized enterprise.
      glossary:
      - term: leave request
        definition: A formal employee request for planned absence from work, submitted
          through the HR system.
      - term: automatic approval
        definition: Approval granted by the system without requiring manual review
          by a manager.
      - term: leave submission window
        definition: The period during which a leave request must be submitted relative
          to the requested start date; requests submitted fewer than 2 business days
          before the start date are routed to expedited manual review regardless of
          eligibility status.
      business_rules:
      - id: BR-01
        rule: Upon automatic approval or manual review routing, the system must send
          the employee a notification within 60 seconds stating the outcome and, in
          the case of manual review routing, the expected response time from the manager.
      constraints: []
