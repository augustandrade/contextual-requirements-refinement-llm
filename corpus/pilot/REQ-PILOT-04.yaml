id: REQ-PILOT-04
category_id: pilot
category_name: Pilot — control (clean requirement)
title: Unambiguous save operation in a document editor
source:
  citation: Author-constructed
base_requirement_text: When the user selects the Save option, the system shall write
  the current document to disk and display a confirmation message.
expected_problem: None — this requirement is intentionally free of ambiguity. It serves
  as a control case to verify that the pipeline does not introduce false positives.
contexts:
  C0:
    inject_context: false
  C1:
    inject_context: true
    controlled_context:
      domain: Desktop document editing application.
      glossary:
      - term: Save option
        definition: A user-initiated command that triggers the persistence of the
          current in-memory document state to persistent storage.
      - term: current document
        definition: The document instance currently active in the editor at the moment
          the save command is issued.
      business_rules: []
      constraints: []
  C2:
    inject_context: true
    controlled_context:
      domain: Desktop document editing application.
      glossary:
      - term: Save option
        definition: A user-initiated command that triggers the persistence of the
          current in-memory document state to persistent storage.
      - term: current document
        definition: The document instance currently active in the editor at the moment
          the save command is issued.
      - term: confirmation message
        definition: A non-modal status notification displayed in the status bar for
          three seconds after a successful save operation.
      business_rules:
      - id: BR-01
        rule: The write operation must complete successfully before the confirmation
          message is displayed. If the write fails, an error notification must be
          shown instead and no confirmation message is displayed.
      constraints: []
  C3:
    inject_context: true
    controlled_context:
      domain: Desktop document editing application.
      glossary:
      - term: Save option
        definition: A user-initiated command that triggers the persistence of the
          current in-memory document state to persistent storage.
      - term: current document
        definition: The document instance currently active in the editor at the moment
          the save command is issued.
      - term: document version record
        definition: Metadata entry appended to the document's version history on each
          successful save, containing the save timestamp, file size in bytes, and the
          user identifier who performed the save.
      business_rules:
      - id: BR-01
        rule: Each successful save operation must append a document version record
          to the file's version history before returning control to the user interface;
          the version history must retain at least the 50 most recent save records.
      constraints: []
