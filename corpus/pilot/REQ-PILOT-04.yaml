id: REQ-PILOT-04
category_id: pilot
category_name: "Pilot — control (clean requirement)"
title: Unambiguous save operation in a document editor
source:
  citation: Author-constructed
base_requirement_text: When the user selects the Save option, the system shall write the current document to disk and display a confirmation message.
expected_problem: None — this requirement is intentionally free of ambiguity and concern mixing. It serves as a control case to verify that the pipeline does not introduce false positives.
expected_behavior: Agent 1 must flag has_ambiguity as false and has_concern_mixing as false. Agent 2 must set status no_ambiguity with no structural_issue. Agent 3 must produce a single structured functional requirement without decomposition.
contexts:
  C0:
    inject_context: false
  C1:
    inject_context: true
    controlled_context:
      domain: Desktop document editing application.
      glossary:
        - term: Save option
          definition: A user-initiated command that triggers the persistence of the current in-memory document state to persistent storage.
        - term: current document
          definition: The document instance currently active in the editor at the moment the save command is issued.
      business_rules: []
      constraints: []
  C2:
    inject_context: true
    controlled_context:
      domain: Desktop document editing application.
      glossary:
        - term: Save option
          definition: A user-initiated command that triggers the persistence of the current in-memory document state to persistent storage.
        - term: current document
          definition: The document instance currently active in the editor at the moment the save command is issued.
        - term: confirmation message
          definition: A non-modal status notification displayed in the status bar for three seconds after a successful save operation.
      business_rules:
        - id: BR-01
          rule: The write operation must complete successfully before the confirmation message is displayed. If the write fails, an error notification must be shown instead and no confirmation message is displayed.
      constraints: []
manual_reference:
  C0:
    expected_resolubility: not_applicable
    expected_has_concern_mixing: false
    expected_findings:
      - has_ambiguity must be false
      - has_concern_mixing must be false
      - '"Save option" is a typographically-demarcated controlled identifier; must NOT be flagged as lexical ambiguity'
      - '"write the current document to disk" is a single functional action; "display a confirmation message" is a second functional action, not a quality criterion — no concern mixing'
      - Agent 3 produces a single functional requirement covering the full save sequence
    should_not_do:
      - flag "Save option" as lexically ambiguous
      - classify the two sequential actions as concern mixing (both are functional actions, not a functional + quality pair)
      - route the case to signaling/bypass
      - produce two separate requirements for the write and the display steps
    applicable_criteria:
      - false_positive_check
      - syntactic_structuring

  C1:
    expected_resolubility: not_applicable
    expected_has_concern_mixing: false
    expected_findings:
      - has_ambiguity must be false
      - has_concern_mixing must be false
      - Glossary enriches the FR description; requirement remains clean and atomic in the context of two sequential functional actions
      - Agent 3 produces a single structured functional requirement
    should_not_do:
      - introduce ambiguity or concern-mixing findings that are absent in the text
      - decompose into separate requirements
    applicable_criteria:
      - false_positive_check
      - syntactic_structuring

  C2:
    expected_resolubility: not_applicable
    expected_has_concern_mixing: false
    expected_findings:
      - has_ambiguity must be false
      - has_concern_mixing must be false
      - Agent 3 incorporates glossary definition for "confirmation message" and error-handling rule from BR-01 into the structured output
      - Single functional requirement output; no decomposition required
    should_not_do:
      - introduce ambiguity or concern-mixing findings that are absent in the text
      - decompose into two requirements based on BR-01
      - ignore BR-01 error handling in the structured output
    applicable_criteria:
      - false_positive_check
      - syntactic_structuring
      - semantic_explicitation
