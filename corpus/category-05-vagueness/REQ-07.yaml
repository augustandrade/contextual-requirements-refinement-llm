      business_rules: []
      constraints: []
  C2:
    intent: resolutive_context
    inject_context: true
    controlled_context:
      domain: Automotive crash-detection and emergency-call system (TCU/ORC).
      glossary: []
      business_rules:
        - id: BR-01
          rule: Automatic emergency calls are triggered for crash severity levels 2 (moderate) and 3 (severe) on the internal crash severity scale; level 1 (minor) does not trigger a call.
      constraints: []
