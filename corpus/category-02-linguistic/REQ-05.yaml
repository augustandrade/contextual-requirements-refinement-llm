id: REQ-05
category_id: category-02-linguistic
category_name: Linguistic and syntactic ambiguities
title: Syntactic attachment ambiguity
source:
  citation: "Pohl (2025), Chapter 25, Example 25-4 (R2)"
base_requirement_text: "The user enters the access card with the access code."
expected_problem: "Unclear attachment: with the access code may describe the card or a separate user action."
expected_behavior: Enumerate plausible interpretations and refine only when context defines interaction flow.
contexts:
  C0:
    intent: no_context
    inject_context: false
  C1:
    intent: general_context
    inject_context: true
    controlled_context:
      domain: Access control system using card reader and keypad.
      glossary:
        - term: access code
          definition: Secret code used for second-factor verification.
      business_rules: []
      constraints: []
  C2:
    intent: resolutive_context
    inject_context: true
    controlled_context:
      domain: Access control system using card reader and keypad.
      glossary: []
      business_rules:
        - id: BR-01
          rule: User first inserts the card into the card reader, then enters the access code on the keypad.
      constraints: []
tags: [linguistic, syntactic-ambiguity, attachment]
status: ready
manual_reference:
  C0:
    expected_resolubility: "unresolved"
    expected_actions:
      - identify_ambiguity
      - classify_ambiguity
      - signal_unresolved_ambiguity
      - avoid_unsupported_inference

  C1:
    expected_resolubility: "unresolved"
    expected_actions:
      - identify_ambiguity
      - classify_ambiguity
      - signal_unresolved_ambiguity
