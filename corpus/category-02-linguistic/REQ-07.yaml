id: REQ-07
category_id: category-02-linguistic
category_name: Linguistic and syntactic ambiguities
title: Vague quantifier in weak word smell
source:
  citation: "Unterbusch & Vogelsang (2026), Table 1, ID 255"
base_requirement_text: "The TCU is connected to the ORC redundantly via CAN and LIN to execute automatic emergency calls on certain crash levels."
expected_problem: "'certain' is a vague quantifier (Pohl 2025, §25.3.5) with no measurable boundary — it is unclear which crash levels trigger automatic emergency calls. Verbatim example from the source, annotated by the authors as a genuine defect (weak word)."
expected_behavior: Flag vagueness and refine into explicit, enumerated crash levels when context resolves the policy.
contexts:
  C0:
    intent: no_context
    inject_context: false
  C1:
    intent: general_context
    inject_context: true
    controlled_context:
      domain: Automotive crash-detection and emergency-call system (TCU/ORC).
      glossary:
        - term: TCU
          definition: Telematics Control Unit.
        - term: ORC
          definition: Occupant Restraint Controller.
      business_rules: []
      constraints: []
  C2:
    intent: resolutive_context
    inject_context: true
    controlled_context:
      domain: Automotive crash-detection and emergency-call system (TCU/ORC).
      glossary: []
      business_rules:
        - id: BR-01
          rule: Automatic emergency calls are triggered for crash severity levels 2 (moderate) and 3 (severe) on the internal crash severity scale; level 1 (minor) does not trigger a call.
      constraints: []
tags: [linguistic, vagueness, weak-word]
status: ready
manual_reference:
  C0:
    expected_resolubility: "unresolved"
    expected_actions:
      - identify_ambiguity
      - classify_ambiguity
      - refine_text
      - avoid_unsupported_inference
    expected_findings:
      - vagueness in "certain crash levels"
      - no measurable boundary defined
    should_not_do:
      - infer which crash levels trigger the call without evidence
      - treat the requirement as fully specified
    applicable_criteria:
      - clarity
      - semantic_explicitation
      - contextual_resolubility

  C1:
    expected_resolubility: "unresolved"
    expected_actions:
      - identify_ambiguity
      - classify_ambiguity
      - refine_text
      - preserve_requirement
    expected_findings:
      - vagueness in "certain crash levels"
      - general domain context (TCU/ORC glossary) does not define which crash levels are meant
    should_not_do:
      - infer which crash levels trigger the call without evidence
      - treat the requirement as fully specified
    applicable_criteria:
      - clarity
      - semantic_explicitation
      - contextual_resolubility

  C2:
    expected_resolubility: "resolvable"
    expected_actions:
      - identify_ambiguity
      - classify_ambiguity
      - refine_text
      - preserve_requirement
    expected_findings:
      - vagueness in "certain crash levels" resolved by BR-01 (levels 2 and 3 explicitly enumerated)
    should_not_do:
      - keep the vague quantifier unchanged
      - ignore the explicit crash-level policy
    applicable_criteria:
      - clarity
      - semantic_explicitation
      - contextual_resolubility
