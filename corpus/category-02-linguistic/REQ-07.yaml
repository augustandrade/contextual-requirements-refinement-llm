base_requirement_text: "When leaving the Factory mode, the ECU should preferably perform a reset."
expected_problem: should preferably creates weak and non-verifiable obligation.
expected_behavior: Flag weak modality and refine into explicit mandatory or optional behavior when context resolves policy.
