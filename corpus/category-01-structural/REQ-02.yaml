id: REQ-02
category_id: category-01-structural
category_name: Structural requirement defects
title: Multiple actions requiring final requirement structuring
source:
  citation: Veizaga et al. (2024), Table 3, Non-atomic requirement smell
base_requirement_text: System-A must add System-B to their downstream systems and
  allow System-C to subscribe to the Reporting flow.
expected_problem: The requirement combines two distinct actions in a single sentence
  (non-atomic requirement smell per Veizaga et al. 2024, Table 3), requiring final
  structuring to preserve both actions clearly.
contexts:
  C0:
    inject_context: false
  C1:
    inject_context: true
    controlled_context:
      domain: Integration platform that orchestrates downstream services and reporting
        subscriptions.
      glossary:
      - term: downstream systems
        definition: External systems that receive events from System-A.
      business_rules: []
      constraints: []
  C2:
    inject_context: true
    controlled_context:
      domain: Integration platform that orchestrates downstream services and reporting
        subscriptions.
      glossary:
      - term: Reporting flow
        definition: Event stream used by subscribers for operational reporting.
      - term: downstream systems
        definition: External systems that receive events from System-A.
      business_rules:
      - id: BR-01
        rule: Partner registration and reporting subscription are independent operations
          and must be specified as separate requirements.
      constraints: []
  C3:
    inject_context: true
    controlled_context:
      domain: Integration platform that orchestrates downstream services and reporting
        subscriptions.
      glossary:
      - term: downstream systems
        definition: External systems that receive events from System-A.
      - term: subscription token
        definition: Unique identifier issued to each subscriber of the Reporting flow,
          used for authentication on each event delivery.
      business_rules:
      - id: BR-01
        rule: Reporting flow subscriptions use a push delivery model; the platform
          delivers events to registered subscriber endpoints within 500 milliseconds
          of the triggering event.
      constraints: []
notes: Additional linguistic ambiguities may exist in the text (e.g. referential antecedent
  of 'their', lexical scope of 'Reporting flow') but are not documented in the cited
  source and are therefore out_of_scope for evaluation.
