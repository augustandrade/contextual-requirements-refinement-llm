id: REQ-02
category_id: category-01-structural
category_name: Structural requirement defects
title: Multiple actions requiring final requirement structuring
source:
  citation: Veizaga et al. (2024), Table 3, Non-atomic requirement smell

base_requirement_text: System-A must add System-B to their downstream systems and allow System-C to subscribe to the Reporting flow.

expected_problem: "The requirement combines two distinct actions in a single sentence, requiring final structuring to preserve both actions clearly. Additionally, the sentence genuinely contains two linguistic ambiguities under Pohl's (2025) taxonomy, independent of the structuring problem: (a) referential ambiguity in \"their downstream systems\" (the plural possessive \"their\" lacks a clear singular antecedent — System-A is singular, so the referent of \"their\" is not grammatically fixed), and (b) lexical ambiguity in \"Reporting flow\" (the term has no glossary definition and its meaning — which flow, which reporting scope — is not inferrable from the sentence alone, so it is expected to be flagged as lexically ambiguous absent a definition)."

expected_behavior: Produce a structured final output that preserves both actions and, when appropriate, represents them as independent structured requirements without treating decomposition as an independent objective.

contexts:
  C0:
    intent: no_context
    inject_context: false

  C1:
    intent: general_context
    inject_context: true
    controlled_context:
      domain: Integration platform that orchestrates downstream services and reporting subscriptions.
      glossary:
        - term: downstream systems
          definition: External systems that receive events from System-A.
      business_rules: []
      constraints: []

  C2:
    intent: resolutive_context
    inject_context: true
    controlled_context:
      domain: Integration platform that orchestrates downstream services and reporting subscriptions.
      glossary:
        - term: Reporting flow
          definition: Event stream used by subscribers for operational reporting.
        - term: their downstream systems
          definition: "System-A's own downstream systems list (the possessive refers back to System-A, the sole actor of the sentence)."
      business_rules:
        - id: BR-01
          rule: Partner registration and reporting subscription are independent operations and must be specified clearly in the final requirement structure.
      constraints: []

tags: [textual-formulation, final-structuring, multiple-actions]
status: ready

manual_reference:
  C0:
    expected_resolubility: resolvable
    expected_actions:
      - identify_textual_formulation_problem
      - structure_final_requirement
      - preserve_requirement_meaning
      - avoid_unsupported_inference

  C1:
    expected_resolubility: resolvable
    expected_actions:
      - identify_textual_formulation_problem
      - structure_final_requirement
      - preserve_requirement_meaning
      - avoid_unsupported_inference

  C2:
    expected_resolubility: resolvable
    expected_actions:
      - identify_textual_formulation_problem
      - structure_final_requirement
      - preserve_requirement_meaning
      - use_contextual_evidence
      - avoid_unsupported_inference
