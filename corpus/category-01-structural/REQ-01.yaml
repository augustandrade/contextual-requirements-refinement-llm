id: REQ-01
category_id: category-01-structural
category_name: Structural requirement defects
title: Non-feasible absolute availability requirement
source:
  citation: 'Pohl (2025), §25.1 — requirement quality criteria: feasibility and verifiability'
base_requirement_text: The payment service shall be available 100% of the time, including
  during maintenance windows and infrastructure upgrades.
expected_problem: The requirement specifies an absolute availability guarantee (100%
  uptime) that explicitly includes planned maintenance and infrastructure upgrades.
  Per Pohl (2025) §25.1, requirements must be feasible and verifiable. A 100% availability
  guarantee including maintenance periods is physically non-feasible for any real
  system and cannot be validated by any acceptance test.
contexts:
