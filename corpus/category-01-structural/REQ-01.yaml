id: REQ-01
category_id: category-01-structural
category_name: Formulation and final structuring problems
title: Function and quality mixed in one sentence
source:
  citation: Pohl (2025)
base_requirement_text: "If the \"glass break detector\" of a window detects the pane has been damaged, the system shall inform the \"security service\" within 2 seconds at the latest."
expected_problem: Functional behavior and timing quality are mixed in one requirement sentence.
expected_behavior: Split into at least one functional requirement and one quality requirement.
contexts:
  C0:
    intent: no_context
    inject_context: false
  C1:
    intent: general_context
    inject_context: true
    controlled_context:
      domain: Building security and alarm monitoring system for offices.
      glossary:
        - term: glass break detector
          definition: Sensor that detects vibration or sound patterns from broken glass.
      business_rules: []
      constraints: []
  C2:
    intent: resolutive_context
    inject_context: true
    controlled_context:
      domain: Building security and alarm monitoring system for offices.
      glossary:
        - term: security service
          definition: External emergency response service connected to the building controller.
      business_rules:
        - id: BR-01
          rule: Damage detection and alarm notification are modeled as a functional requirement.
      constraints:
        - id: QLT-01
          text: Alarm notification must be sent within 2 seconds after damage detection.
tags: [structural, concern-separation, function-quality]
status: ready
manual_reference:
  # NOTE (corpus revision): concern_mixing is NOT classified as linguistic ambiguity per
  # Pohl §25.2 and the adopted pipeline standard. Agent 1 must return has_ambiguity: false
  # with concern_mixing noted in no_ambiguity_reason. Agent 3 performs decomposition.
  # expected_resolubility is set to not_applicable (no ambiguity to resolve);
  # identify_ambiguity and classify_ambiguity removed from expected_actions accordingly.

  C0:
    expected_resolubility: "not_applicable"
    expected_actions:
      - detect_concern_mixing
      - decompose_requirement
      - separate_concerns
      - preserve_requirement
    expected_findings:
      - Agent 1a returns has_ambiguity false; no_ambiguity_reason explains the concern_mixing structural issue
      - Agent 1b returns has_concern_mixing true (functional action + quality criterion in same sentence)
      - Agent 2 is bypassed — synthetic no_ambiguity block used by the orchestrator
      - Agent 3 receives concern_mixing_detection from Agent 1b and decomposes into at least one functional requirement and one quality requirement
    should_not_do:
      - flag concern_mixing as a linguistic ambiguity (has_ambiguity must be false)
      - merge functional and quality requirements in final output
      - invent quality criteria not present in the text
    applicable_criteria:
      - atomicity
      - concern_separation
      - syntactic_structuring
      - semantic_explicitation
      - clarity

  C1:
    expected_resolubility: "not_applicable"
    expected_actions:
      - detect_concern_mixing
      - decompose_requirement
      - separate_concerns
      - structure_with_template
    expected_findings:
      - Agent 1a returns has_ambiguity false; no_ambiguity_reason explains the concern_mixing structural issue
      - Agent 1b returns has_concern_mixing true (functional action + quality criterion in same sentence)
      - Agent 2 is bypassed — synthetic no_ambiguity block used by the orchestrator
      - Agent 3 receives concern_mixing_detection from Agent 1b and decomposes into at least one functional requirement and one quality requirement
      - glossary term used to clarify glass break detector role
    should_not_do:
      - flag concern_mixing as a linguistic ambiguity (has_ambiguity must be false)
      - merge functional and quality requirements in final output
      - infer additional behavior not supported by the text
    applicable_criteria:
      - atomicity
      - concern_separation
      - syntactic_structuring
      - semantic_explicitation
      - clarity

  C2:
    expected_resolubility: "not_applicable"
    expected_actions:
      - detect_concern_mixing
      - decompose_requirement
      - separate_concerns
      - refine_text
    expected_findings:
      - Agent 1a returns has_ambiguity false; no_ambiguity_reason explains the concern_mixing structural issue
      - Agent 1b returns has_concern_mixing true (functional action + quality criterion in same sentence)
      - Agent 2 is bypassed — synthetic no_ambiguity block used by the orchestrator
      - Agent 3 receives concern_mixing_detection from Agent 1b and decomposes; quality requirement uses constraint QLT-01 (within 2 seconds)
    should_not_do:
      - flag concern_mixing as a linguistic ambiguity (has_ambiguity must be false)
      - merge functional and quality requirements in final output
      - ignore the explicit timing constraint from QLT-01
      - infer extra constraints beyond the stated 2-second deadline
    applicable_criteria:
      - atomicity
      - concern_separation
      - syntactic_structuring
      - semantic_explicitation
      - clarity
